  <!-- Andhra Pradesh -->
  <path d="M 350 430 L 385 420 L 415 435 L 430 465 L 425 500 L 405 525 L 375 530 L 350 515 L 340 485 Z"
        fill="#EA580C" stroke="#d0d0d0" stroke-width="1.5" id="andhra-pradesh"/>

  <!-- Karnataka -->
  <path d="M 280 445 L 320 440 L 350 455 L 360 490 L 355 530 L 330 555 L 295 555 L 270 535 L 265 500 Z"
        fill="#DC2626" stroke="#d0d0d0" stroke-width="1.5" id="karnataka"/>

  <!-- Goa -->
  <path d="M 250 425 L 270 420 L 280 435 L 278 450 L 265 460 L 250 455 Z"
        fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1.5" id="goa"/>

  <!-- Tamil Nadu -->
  <path d="M 295 555 L 330 550 L 360 565 L 375 595 L 370 630 L 350 655 L 320 660 L 290 645 L 280 615 Z"
