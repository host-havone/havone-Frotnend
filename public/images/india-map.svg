  <path d="M 220 180 L 270 165 L 295 180 L 310 210 L 315 250 L 300 280 L 270 290 L 240 285 L 215 260 L 205 220 Z"
        fill="#EA580C" stroke="#d0d0d0" stroke-width="1.5" id="rajasthan"/>

  <!-- Gujarat -->
  <path d="M 180 260 L 220 245 L 250 260 L 260 290 L 255 320 L 235 340 L 205 345 L 180 330 L 170 300 Z"
        fill="#EA580C" stroke="#d0d0d0" stroke-width="1.5" id="gujarat"/>

  <!-- Madhya Pradesh -->
  <path d="M 270 290 L 320 280 L 365 290 L 395 310 L 400 345 L 380 375 L 350 385 L 315 380 L 285 365 L 265 340 Z"
        fill="#DC2626" stroke="#d0d0d0" stroke-width="1.5" id="madhya-pradesh"/>

  <!-- Uttar Pradesh -->
  <path d="M 320 210 L 370 200 L 420 210 L 460 230 L 475 260 L 470 290 L 450 315 L 420 320 L 390 310 L 365 290 L 340 280 Z"
        fill="#DC2626" stroke="#d0d0d0" stroke-width="1.5" id="uttar-pradesh"/>

  <!-- Bihar -->
  <path d="M 450 315 L 480 305 L 510 320 L 525 340 L 520 360 L 500 370 L 475 365 L 455 350 Z"
        fill="#F59E0B" stroke="#d0d0d0" stroke-width="1.5" id="bihar"/>

  <!-- West Bengal -->
  <path d="M 500 370 L 525 360 L 545 375 L 555 400 L 548 430 L 530 445 L 510 440 L 495 420 Z"
        fill="#EA580C" stroke="#d0d0d0" stroke-width="1.5" id="west-bengal"/>

  <!-- Jharkhand -->
  <path d="M 475 365 L 500 360 L 520 375 L 525 395 L 515 415 L 495 420 L 475 410 Z"
        fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1.5" id="jharkhand"/>

  <!-- Odisha -->
  <path d="M 450 380 L 475 375 L 495 390 L 505 420 L 500 450 L 480 470 L 455 465 L 440 440 Z"
        fill="#F59E0B" stroke="#d0d0d0" stroke-width="1.5" id="odisha"/>

  <!-- Chhattisgarh -->
  <path d="M 380 375 L 410 370 L 440 385 L 455 410 L 450 440 L 430 455 L 405 450 L 385 430 Z"
        fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1.5" id="chhattisgarh"/>

  <!-- Maharashtra -->
  <path d="M 235 340 L 280 330 L 320 340 L 350 360 L 360 395 L 350 430 L 320 450 L 280 445 L 250 425 L 230 390 Z"
