        fill="#10B981" stroke="#d0d0d0" stroke-width="1.5" id="kerala"/>

  <!-- Northeast States (grouped) -->
  <path d="M 530 445 L 555 435 L 570 450 L 575 475 L 560 495 L 540 500 L 525 485 Z"
        fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1.5" id="northeast"/>

  <!-- Andaman & Nicobar Islands -->
  <circle cx="520" cy="580" r="8" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
  <circle cx="525" cy="605" r="6" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
  <circle cx="530" cy="625" r="5" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Lakshadweep Islands -->
  <circle cx="180" cy="550" r="4" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
  <circle cx="175" cy="565" r="3" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1"/>
</svg>
