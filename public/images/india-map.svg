<svg width="600" height="700" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="stateShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <filter id="activeGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="#f8f9fa"/>

  <!-- Kashmir Region -->
  <path d="M 280 60 L 300 50 L 320 55 L 335 70 L 340 90 L 330 110 L 310 120 L 290 115 L 275 95 Z"
        fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1.5" id="kashmir"/>

  <!-- Himachal Pradesh -->
  <path d="M 290 115 L 310 120 L 325 130 L 330 145 L 320 160 L 300 165 L 285 155 Z"
        fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1.5" id="himachal"/>

  <!-- Punjab -->
  <path d="M 270 130 L 290 125 L 310 135 L 315 150 L 305 165 L 285 170 L 270 160 Z"
        fill="#F59E0B" stroke="#d0d0d0" stroke-width="1.5" id="punjab"/>

  <!-- Haryana -->
  <path d="M 285 170 L 305 165 L 320 175 L 325 190 L 315 205 L 295 210 L 280 200 Z"
        fill="#F59E0B" stroke="#d0d0d0" stroke-width="1.5" id="haryana"/>

  <!-- Uttarakhand -->
  <path d="M 330 145 L 350 140 L 365 150 L 370 165 L 360 180 L 340 185 L 325 175 Z"
        fill="#e8e8e8" stroke="#d0d0d0" stroke-width="1.5" id="uttarakhand"/>

